name: Fix V05 audited overlay controls
on:
  push:
    branches: [v04-v03-stable-base]
    paths:
      - '.github/scripts/fix_v05_controls_audit.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v04-v03-stable-base
      - name: Apply audited control fixes
        run: python .github/scripts/fix_v05_controls_audit.py
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts \
            app/src/main/java/com/lucianotoscano/pvppokego/MainActivity.kt \
            app/src/main/java/com/lucianotoscano/pvppokego/data/SettingsRepository.kt \
            app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt \
            app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayView.kt
          if git diff --cached --quiet; then
            echo 'No source changes required'
            exit 0
          fi
          git commit -m 'fix: harden V05 overlay controls and reset state'
          git push
