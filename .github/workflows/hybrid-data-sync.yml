name: Hybrid data sync validation

on:
  push:
    branches:
      - feature/hybrid-data-sync-0.5.29
    paths:
      - 'app/**'
      - 'core/**'
      - '*.gradle.kts'
      - '.github/workflows/hybrid-data-sync.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - '*.gradle.kts'
      - '.github/workflows/hybrid-data-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests and Standard QA APK
        run: gradle --no-daemon --stacktrace :app:testStandardDebugUnitTest :app:assembleStandardDebug
      - name: Verify and hash APK
        run: |
          set -euo pipefail
          mkdir -p artifact
          apk=app/build/outputs/apk/standard/debug/app-standard-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          cp "$apk" artifact/PvPPokeGo-hybrid-QA-debug.apk
          sha256sum artifact/PvPPokeGo-hybrid-QA-debug.apk > artifact/SHA256SUMS.txt
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-hybrid-QA
          path: artifact/
          if-no-files-found: error
