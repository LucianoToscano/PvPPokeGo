name: Build Android V05 copilot hardening

# build trigger: nullable auto-league fix + free-drag controls final
on:
  push:
    branches: [v04-v03-stable-base]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-log.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect output
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp build-log.txt artifact/build-log.txt || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifact/PVPPokeGo_V05-copilot-debug.apk
            sha256sum artifact/PVPPokeGo_V05-copilot-debug.apk > artifact/PVPPokeGo_V05-copilot-debug.apk.sha256
          fi

      - name: Upload APK and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PVPPokeGo-V05-copilot-build
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Fail if Gradle failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
