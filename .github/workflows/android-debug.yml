name: Build PvPPokeGo 0.5.11

on:
  push:
    branches: [v04-v03-stable-base]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 0.5.11 staged patch
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/scripts/patches/0511-*.patch; do
            echo "Applying $f"
            patch -p1 < "$f"
          done

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint, tests and build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build-log.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect output
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp build-log.txt artifact/build-log.txt || true
          if [ -f app/build/reports/lint-results-debug.html ]; then
            cp app/build/reports/lint-results-debug.html artifact/lint-results-debug.html
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifact/PvPPokeGo-0.5.11.apk
            sha256sum artifact/PvPPokeGo-0.5.11.apk > artifact/PvPPokeGo-0.5.11.apk.sha256
          fi

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.11-build
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Fail if validation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
