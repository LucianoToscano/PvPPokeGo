name: Build Android V03

on:
  push:
    branches: [main, v03-overlay-fixes]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.build/seed.part*'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand V03 source seed when present
        shell: bash
        run: |
          if compgen -G '.build/seed.part*' > /dev/null; then
            cat .build/seed.part* | base64 -d > /tmp/PVPPokeGo_V03_seed.zip
            unzip -t /tmp/PVPPokeGo_V03_seed.zip
            unzip -o /tmp/PVPPokeGo_V03_seed.zip -d .
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-log.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect output
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp build-log.txt artifact/build-log.txt || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifact/PVPPokeGo_V03-debug.apk
          fi

      - name: Upload APK and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PVPPokeGo-V03-build
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Expand readable source into branch after a successful build
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          if compgen -G '.build/seed.part*' > /dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app build.gradle.kts settings.gradle.kts gradle.properties
            git rm -f .build/PVPPokeGo_V03_seed.zip .build/seed.part* || true
            git commit -m 'Expand Android V03 source [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fail if Gradle failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
