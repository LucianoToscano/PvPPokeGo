name: Build PvPPokeGo 0.5.15 trial15

on:
  push:
    branches: [build/trial15-chatgpt-20261006]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Publish this run ID
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh issue create --repo "$REPO" --title "[CI] release-workflow trial15 run $RUN_ID" --body "run_id=$RUN_ID"$'\n'"head_sha=$HEAD_SHA"$'\n'"artifact=PvPPokeGo-0.5.15-trial15-signed"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact uploaded trial15 source changes
        run: python3 .github/scripts/apply_trial15_uploaded.py

      - name: Validate exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "a2678a6ab744e397b4632c7324d83090188a6b7819dc41c64523a4beb49d273d  app/build.gradle.kts" | shasum -a 256 -c -
          echo "a2fb4dcac26b42276250f66abe35200946ae12d12999504ed81195b60910060d  app/proguard-rules.pro" | shasum -a 256 -c -
          echo "826df11d451443eb214fa2597c47c4e87a1ce2ae57b0c3ff03b1b20c6356dc48  app/src/main/java/com/lucianotoscano/pvppokego/MainActivity.kt" | shasum -a 256 -c -
          echo "762a1b380ad8536c8739115d502da3d239605fe424c5fff26541f3e3df39bb4d  app/src/main/java/com/lucianotoscano/pvppokego/PvPPokeGoApp.kt" | shasum -a 256 -c -
          echo "a885fbd48a290f4c822a0a8bc64fa1e193a0ac02f2eb63dd86d514f12b53089f  app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt" | shasum -a 256 -c -
          echo "da73ab4e2f3edd653d8891dc8544c98f4870d8ec3d296ce47345e235a46c7908  app/src/main/java/com/lucianotoscano/pvppokego/security/TrialManager.kt" | shasum -a 256 -c -

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build minified release
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          keytool -genkeypair -v -keystore /tmp/trial15.jks -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=PvPPokeGo Trial15, O=PvPPokeGo, C=BR"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk artifact/PvPPokeGo-0.5.15-trial15-aligned.apk
          "$BT/apksigner" sign --ks /tmp/trial15.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out artifact/PvPPokeGo-0.5.15-trial15.apk artifact/PvPPokeGo-0.5.15-trial15-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs artifact/PvPPokeGo-0.5.15-trial15.apk
          rm artifact/PvPPokeGo-0.5.15-trial15-aligned.apk
          shasum -a 256 artifact/PvPPokeGo-0.5.15-trial15.apk > artifact/PvPPokeGo-0.5.15-trial15.apk.sha256
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then cp app/build/outputs/mapping/release/mapping.txt artifact/mapping.txt; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.15-trial15-signed
          path: artifact/
          retention-days: 14
