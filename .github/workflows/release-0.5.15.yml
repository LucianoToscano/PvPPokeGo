name: Build PvPPokeGo 0.5.15

on:
  push:
    branches: [release/0.5.15]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 0.5.15 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.5.15"' app/build.gradle.kts
          grep -q 'ensureApprovedLayoutV15' app/src/main/java/com/lucianotoscano/pvppokego/data/SettingsRepository.kt
          grep -q 'hud_enemy_moves_x", 723.6773682f' app/src/main/java/com/lucianotoscano/pvppokego/data/SettingsRepository.kt
          grep -q 'hud_enemy_moves_y", 233.8441772f' app/src/main/java/com/lucianotoscano/pvppokego/data/SettingsRepository.kt
          grep -q 'chargedY=fastY+ry(112f)' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayView.kt
          grep -q 'fastY + 129f' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          grep -q 'android.R.drawable.ic_menu_preferences' app/src/main/java/com/lucianotoscano/pvppokego/overlay/QuickOverlayMenu.kt
          if grep -q 'DelicateGearView' app/src/main/java/com/lucianotoscano/pvppokego/overlay/QuickOverlayMenu.kt; then
            echo "Old custom sun-like gear still present"
            exit 1
          fi
          grep -q 'ACTION_TOGGLE_VISION' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          grep -q 'ACTION_TOGGLE_OVERLAY' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          if grep -q '(hudLockTouch as? TextView)?.text' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt; then
            echo "Legacy emoji lock setter returned"
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Package APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/PvPPokeGo-0.5.15.apk
          shasum -a 256 artifact/PvPPokeGo-0.5.15.apk > artifact/PvPPokeGo-0.5.15.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.15
          path: artifact/
          retention-days: 14
