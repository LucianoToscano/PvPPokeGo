name: Windows QA PvPPokeGo 0.5.25

on:
  push:
    branches: [release/0.5.25]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvppokego-windows-0525-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Select-String -Path app/build.gradle.kts -Pattern 'versionName = "0.5.25"' -Quiet | ForEach-Object { if (-not $_) { throw "versionName mismatch" } }
          Select-String -Path app/build.gradle.kts -Pattern 'versionCode = 30' -Quiet | ForEach-Object { if (-not $_) { throw "versionCode mismatch" } }
          if (Select-String -Path app/src/main/AndroidManifest.xml -Pattern 'PvPPokeGoAccessibilityCaptureService|FOREGROUND_SERVICE_SPECIAL_USE|specialUse' -Quiet) {
            throw "Sensitive recorder compat declaration leaked into standard manifest"
          }

      - name: Package offline PvPoke snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/package_offline_pvpoke_assets.py
          @(
            "app/src/main/assets/gamemaster.json",
            "app/src/main/assets/rankings-1500.json",
            "app/src/main/assets/rankings-2500.json",
            "app/src/main/assets/rankings-10000.json",
            "app/src/main/assets/pvpoke_cpms.json",
            "app/src/main/assets/pvpoke_LICENSE.txt",
            "app/src/main/assets/pvpoke_snapshot.json"
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing asset $_" } }

      - name: Build visual bank and icon atlas
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check pillow
          python tools/package_visual_fingerprints.py
          @(
            "app/src/main/assets/pokemon_visual_fingerprints.json",
            "app/src/main/assets/pokemon_icon_atlas.png",
            "app/src/main/assets/pokemon_icon_atlas.json"
          ) | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing visual asset $_" } }

      - name: Test and build both variants
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gradle --no-daemon --stacktrace :app:testStandardDebugUnitTest :app:testRecorderCompatDebugUnitTest :app:assembleStandardDebug :app:assembleRecorderCompatDebug

      - name: Verify merged manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $std = Get-ChildItem -Recurse app/build/intermediates/merged_manifests/standardDebug -Filter AndroidManifest.xml | Select-Object -First 1
          $compat = Get-ChildItem -Recurse app/build/intermediates/merged_manifests/recorderCompatDebug -Filter AndroidManifest.xml | Select-Object -First 1
          if (-not $std -or -not $compat) { throw "Merged manifests not found" }
          $stdText = Get-Content $std.FullName -Raw
          $compatText = Get-Content $compat.FullName -Raw
          if ($stdText -match 'PvPPokeGoAccessibilityCaptureService|FOREGROUND_SERVICE_SPECIAL_USE|specialUse') { throw "Standard merged manifest leaked sensitive service" }
          if ($stdText -notmatch 'foregroundServiceType="mediaProjection"') { throw "Standard mediaProjection service type missing" }
          if ($compatText -notmatch 'PvPPokeGoAccessibilityCaptureService') { throw "Recorder Compat accessibility service missing" }
          if ($compatText -notmatch 'FOREGROUND_SERVICE_SPECIAL_USE') { throw "Recorder Compat specialUse permission missing" }

      - name: Package and validate APKs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force delivery | Out-Null
          Copy-Item app/build/outputs/apk/standard/debug/app-standard-debug.apk delivery/PvPPokeGo-0.5.25-QA-debug.apk
          Copy-Item app/build/outputs/apk/recorderCompat/debug/app-recorderCompat-debug.apk delivery/PvPPokeGo-0.5.25-recorder-compat-QA-debug.apk
          python - <<'PY'
          import zipfile, pathlib
          for p in pathlib.Path("delivery").glob("*.apk"):
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  if bad: raise SystemExit(f"{p}: corrupt member {bad}")
                  names=set(z.namelist())
                  for required in ("assets/gamemaster.json","assets/pvpoke_snapshot.json","assets/pokemon_visual_fingerprints.json","assets/pokemon_icon_atlas.png","assets/pokemon_icon_atlas.json"):
                      if required not in names: raise SystemExit(f"{p}: missing {required}")
                  print(p, "ZIP OK", len(names), "entries")
          PY
          Get-ChildItem delivery/*.apk | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }

      - name: Upload QA delivery
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.25-Windows-QA
          path: delivery/
          retention-days: 30
