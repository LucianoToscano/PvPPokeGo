name: Build PvPPokeGo 0.5.18

on:
  push:
    branches: [release/0.5.18]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 0.5.18 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.5.18"' app/build.gradle.kts
          grep -q 'exportAnalysisText' app/src/main/java/com/lucianotoscano/pvppokego/data/BattleHistoryRepository.kt
          grep -q 'exportCsv' app/src/main/java/com/lucianotoscano/pvppokego/data/BattleHistoryRepository.kt
          grep -q 'exportHistoryLauncher' app/src/main/java/com/lucianotoscano/pvppokego/MainActivity.kt
          grep -q 'PvPPokeGo-0.5.18-historico.zip' app/src/main/java/com/lucianotoscano/pvppokego/MainActivity.kt
          grep -q 'BattleHistoryEventCard' app/src/main/java/com/lucianotoscano/pvppokego/ui/SettingsScreen.kt
          grep -q 'Mostrar diagnóstico técnico' app/src/main/java/com/lucianotoscano/pvppokego/ui/SettingsScreen.kt
          grep -q 'Exportar ZIP' app/src/main/java/com/lucianotoscano/pvppokego/ui/SettingsScreen.kt
          grep -q 'android:icon="@drawable/pvppokego_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'ReserveCardMatcher' app/src/main/java/com/lucianotoscano/pvppokego/engine/BattleEngine.kt
          grep -q 'ScreenFrameRecorder' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt

      - name: Package offline PvPoke snapshot
        run: |
          python3 tools/package_offline_pvpoke_assets.py
          test -s app/src/main/assets/gamemaster.json
          test -s app/src/main/assets/rankings-1500.json
          test -s app/src/main/assets/rankings-2500.json
          test -s app/src/main/assets/rankings-10000.json
          test -s app/src/main/assets/pvpoke_snapshot.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Package APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/PvPPokeGo-0.5.18.apk
          shasum -a 256 artifact/PvPPokeGo-0.5.18.apk > artifact/PvPPokeGo-0.5.18.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.18
          path: artifact/
          retention-days: 14
