name: Package complete project ZIP

on:
  push:
    branches:
      - v04-v03-stable-base
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package offline PvPoke data
        run: python3 tools/package_offline_pvpoke_assets.py

      - name: Build Pokémon visual fingerprint bank
        run: |
          python3 -m venv .venv-visual
          . .venv-visual/bin/activate
          python -m pip install --disable-pip-version-check pillow
          python tools/package_visual_fingerprints.py
          test -s app/src/main/assets/pokemon_visual_fingerprints.json

      - name: Create project ZIP
        run: |
          # Keep generated offline assets, but never ship the temporary Python venv.
          rm -rf .venv-visual
          zip -r PvPPokeGo_COMPLETE_PROJECT.zip . \
            -x "./.git/*" "./.gradle/*" "./app/build/*" "./build/*"

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-COMPLETE-PROJECT
          path: PvPPokeGo_COMPLETE_PROJECT.zip
          if-no-files-found: error
          retention-days: 30
