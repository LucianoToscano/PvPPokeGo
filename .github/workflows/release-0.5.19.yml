name: Build PvPPokeGo 0.5.19

on:
  push:
    branches: [release/0.5.19]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 0.5.19 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.5.19"' app/build.gradle.kts
          grep -q 'applicationId = "com.lucianotoscano.pvppokego"' app/build.gradle.kts
          if grep -q 'applicationIdSuffix = ".debug"' app/build.gradle.kts; then
            echo "Debug suffix must not return"
            exit 1
          fi
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/pvppokego_launcher.png
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'recognizeTeamSlot' app/src/main/java/com/lucianotoscano/pvppokego/detect/BattleOcrDetector.kt
          grep -q 'TEAM_SLOT_1_LEFT' app/src/main/java/com/lucianotoscano/pvppokego/detect/BattleOcrDetector.kt
          grep -q 'RESERVE_TOP_1' app/src/main/java/com/lucianotoscano/pvppokego/detect/BattleOcrDetector.kt
          grep -q 'needsReserveCardScan' app/src/main/java/com/lucianotoscano/pvppokego/engine/BattleEngine.kt
          grep -q 'identityConfirmed' app/src/main/java/com/lucianotoscano/pvppokego/engine/BattleAssistAdvisor.kt
          grep -q 'sanitizePokemonTypes' app/src/main/java/com/lucianotoscano/pvppokego/data/GameDataRepository.kt
          grep -q 'rillaboomKeepsOnlyGrass' app/src/test/java/com/lucianotoscano/pvppokego/data/PokemonTypeSanitizerTest.kt
          grep -q 'cpPinsCramorantAndRillaboomToCorrectCards' app/src/test/java/com/lucianotoscano/pvppokego/engine/ReserveCardMatcherTest.kt

      - name: Package offline PvPoke snapshot
        run: |
          python3 tools/package_offline_pvpoke_assets.py
          test -s app/src/main/assets/gamemaster.json
          test -s app/src/main/assets/rankings-1500.json
          test -s app/src/main/assets/rankings-2500.json
          test -s app/src/main/assets/rankings-10000.json
          test -s app/src/main/assets/pvpoke_snapshot.json
          python3 - <<'PY'
          import json
          gm=json.load(open("app/src/main/assets/gamemaster.json"))
          by={p.get("speciesId","").lower(): p for p in gm.get("pokemon",[])}
          assert by["cramorant"]["types"] == ["flying","water"], by["cramorant"]["types"]
          assert by["rillaboom"]["types"] == ["grass","none"], by["rillaboom"]["types"]
          assert by["houndoom"]["types"] == ["dark","fire"], by["houndoom"]["types"]
          print("PvPoke type source sanity OK")
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Package APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/PvPPokeGo-0.5.19.apk
          shasum -a 256 artifact/PvPPokeGo-0.5.19.apk > artifact/PvPPokeGo-0.5.19.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.19
          path: artifact/
          retention-days: 14
