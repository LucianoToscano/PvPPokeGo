name: Apply edit mode control fix

on:
  push:
    branches:
      - v04-v03-stable-base
    paths:
      - .github/workflows/apply-edit-mode-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v04-v03-stable-base

      - name: Patch BattleOverlayService
        run: python .github/scripts/patch_edit_mode.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: make edit mode controllable and show active battle mode"
          git push origin HEAD:v04-v03-stable-base
