name: PvPPokeGo 0.5.33 QA APK

on:
  push:
    branches:
      - feature/diagnostics-hp-ui-0.5.33
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile standard debug and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:assembleStandardDebug --no-daemon --stacktrace
      - name: Prepare installable APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk output/PvPPokeGo-0.5.33.apk
          sha256sum output/PvPPokeGo-0.5.33.apk | tee output/SHA256.txt
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.33-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
