name: Apply GO-style HUD v3

on:
  push:
    branches: [v04-v03-stable-base]
    paths:
      - '.github/workflows/apply-go-style-hud-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v04-v03-stable-base

      - name: Apply patch helper
        run: python .github/scripts/patch_go_style.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayView.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "ui: align top chips and restyle enemy moves like GO buttons"
          git push origin HEAD:v04-v03-stable-base
