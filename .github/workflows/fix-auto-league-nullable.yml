name: Fix auto league nullable compile
on:
  push:
    branches: [v04-v03-stable-base]
    paths:
      - '.github/scripts/fix_auto_league_nullable.py'
      - '.github/workflows/fix-auto-league-nullable.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v04-v03-stable-base
      - run: python .github/scripts/fix_auto_league_nullable.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: compile auto league fallback safely'
          git push origin HEAD:v04-v03-stable-base
