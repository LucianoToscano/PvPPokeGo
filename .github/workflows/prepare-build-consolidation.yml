name: Consolidar fonte pública de build no PvPPokeGo
on:
  push:
    paths:
      - '.github/workflows/prepare-build-consolidation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Importar snapshot editável sem sobrescrever o core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c consolidacao/pvppokego-apk-build-2026-11-21
          git clone --depth 1 https://github.com/LucianoToscano/PvPPokeGo-APK-Build.git "$RUNNER_TEMP/pvppokego_build"
          SOURCE="$RUNNER_TEMP/pvppokego_build"
          test -f "$SOURCE/settings.gradle.kts"
          test -f "$SOURCE/app/src/main/res/drawable-nodpi/pvppokego_launcher.png"
          test -d core/src/main/kotlin
          cp -a "$SOURCE/app" ./app
          cp "$SOURCE/settings.gradle.kts" ./settings.gradle.kts
          cp "$SOURCE/build.gradle.kts" ./build.gradle.kts
          cp "$SOURCE/gradle.properties" ./gradle.properties
          mkdir -p docs/consolidacao .github/workflows tools
          cp "$SOURCE/README.md" docs/consolidacao/APK_BUILD_MIRROR_README.md
          cp "$SOURCE/THIRD_PARTY_NOTICES.md" docs/consolidacao/APK_BUILD_THIRD_PARTY_NOTICES.md
          for file in "$SOURCE"/tools/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            if [ ! -e "tools/$name" ]; then
              cp "$file" "tools/$name"
            elif ! cmp -s "$file" "tools/$name"; then
              cp "$file" "docs/consolidacao/APK_BUILD_ORIGINAL_$name"
            fi
          done
          printf 'Fonte importada de LucianoToscano/PvPPokeGo-APK-Build.\nCore e documentos existentes mantidos.\nExecutar validacao antes de integrar na main.\n' > docs/consolidacao/MIGRATION_NOTES.txt
          git add app settings.gradle.kts build.gradle.kts gradle.properties docs/consolidacao tools
          git commit -m 'feat: consolidar fonte Android do mirror de APK preservando core PvP'
          git push origin HEAD:refs/heads/consolidacao/pvppokego-apk-build-2026-11-21
