name: Build exact 0.5.6 post-audit source v2

on:
  push:
    branches: [v04-v03-stable-base]
    paths:
      - '.github/workflows/build-exact-0.5.6-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply audited source patch
        run: |
          base64 -d .github/audit/0.5.6.patch.b64 | gzip -d > /tmp/audit.patch
          git apply --check /tmp/audit.patch
          git apply /tmp/audit.patch
          grep -n 'versionCode\|versionName' app/build.gradle.kts
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Collect APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/PvPPokeGo_0.5.6-post-audit-debug.apk
          sha256sum artifact/PvPPokeGo_0.5.6-post-audit-debug.apk > artifact/PvPPokeGo_0.5.6-post-audit-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.6-post-audit-exact
          path: artifact/
          retention-days: 14
