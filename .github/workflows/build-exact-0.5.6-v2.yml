name: Build exact 0.5.8 canvas lock-eye

on:
  push:
    branches:
      - v04-v03-stable-base
    paths:
      - '.github/workflows/build-exact-0.5.6-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply audited 0.5.6 source
        run: |
          base64 -d .github/audit/0.5.6.patch.b64 | gzip -d > /tmp/audit.patch
          git apply --check /tmp/audit.patch
          git apply /tmp/audit.patch
      - name: Apply 0.5.8 canvas lock-eye fix
        run: |
          perl -0pi -e 's/hudToggleTouch = TextView\(this\)\.apply \{\n\s*gravity = Gravity\.CENTER\n\s*text = if \(hudCollapsed\) "👁" else "🙈"\n\s*textSize = 20f\n\s*setTextColor\(Color\.WHITE\)\n\s*setShadowLayer\(3f, 0f, 1f, Color\.BLACK\)\n\s*background = controlButtonBackground\(\)/hudToggleTouch = View(this).apply {\n            setBackgroundColor(Color.TRANSPARENT)/s' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          perl -0pi -e 's/hudLockTouch = TextView\(this\)\.apply \{\n\s*gravity = Gravity\.CENTER\n\s*text = if \(settingsRepo\.layoutLocked\) "🔒" else "🔓"\n\s*textSize = 20f\n\s*setTextColor\(Color\.WHITE\)\n\s*setShadowLayer\(3f, 0f, 1f, Color\.BLACK\)\n\s*background = controlButtonBackground\(\)/hudLockTouch = View(this).apply {\n            setBackgroundColor(Color.TRANSPARENT)/s' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          sed -i '/(hudToggleTouch as? TextView)?.text = if (hudCollapsed)/d' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          sed -i '/(hudLockTouch as? TextView)?.text = if (settingsRepo.layoutLocked)/d' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          sed -i 's/versionCode = 11/versionCode = 13/' app/build.gradle.kts
          sed -i 's/versionName = "0.5.6-post-audit"/versionName = "0.5.8-canvas-lock-eye"/' app/build.gradle.kts
          grep -n 'hudToggleTouch =\|hudLockTouch =\|versionCode\|versionName' app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt app/build.gradle.kts
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Collect APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/PvPPokeGo_0.5.8-canvas-lock-eye-debug.apk
          sha256sum artifact/PvPPokeGo_0.5.8-canvas-lock-eye-debug.apk > artifact/PvPPokeGo_0.5.8-canvas-lock-eye-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.8-canvas-lock-eye
          path: artifact/
          retention-days: 14
