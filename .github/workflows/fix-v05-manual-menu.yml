name: Fix V05 manual move menu
on:
  push:
    branches: [v04-v03-stable-base]
    paths:
      - '.github/scripts/fix_v05_manual_menu.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v04-v03-stable-base
      - run: python .github/scripts/fix_v05_manual_menu.py
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/lucianotoscano/pvppokego/overlay/BattleOverlayService.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: allow move selection in manual HUD mode'
          git push
