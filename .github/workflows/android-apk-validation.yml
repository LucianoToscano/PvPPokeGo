name: PvPPokeGo Android APK validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Usar SDK Android preinstalado no runner
        run: |
          test -d "$ANDROID_HOME/cmdline-tools"
          find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1

      - name: Android platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Empacotar dados PvP e ícones do espelho
        run: |
          python3 tools/package_offline_pvpoke_assets.py
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/package_visual_fingerprints.py

      - name: Testar e compilar APK Standard
        run: gradle --no-daemon :app:testStandardDebugUnitTest :app:assembleStandardDebug

      - name: Package APK and SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk dist/PvPPokeGo-consolidacao-standard-debug.apk
          sha256sum dist/PvPPokeGo-consolidacao-standard-debug.apk | tee dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-consolidacao-standard-debug
          path: dist/*
          if-no-files-found: error
