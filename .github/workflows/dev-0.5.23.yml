name: Dev PvPPokeGo 0.5.23

on:
  push:
    branches: [dev/0.5.23-reserves]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvppokego-dev-0523-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 0.5.23 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.5.23"' app/build.gradle.kts
          grep -q 'versionCode = 28' app/build.gradle.kts
          grep -q 'create("standard")' app/build.gradle.kts
          grep -q 'create("recorderCompat")' app/build.gradle.kts
          grep -q 'android:icon="@drawable/pvppokego_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'EnemyEnergyTracker' app/src/main/java/com/lucianotoscano/pvppokego/engine/BattleEngine.kt
          grep -q 'ChargedMovePredictor' app/src/main/java/com/lucianotoscano/pvppokego/engine/BattleEngine.kt
          grep -q 'ReactionWindowEstimator' app/src/main/java/com/lucianotoscano/pvppokego/engine/BattleEngine.kt
          grep -q 'DamageForecastEngine' app/src/main/java/com/lucianotoscano/pvppokego/engine/BattleEngine.kt
          grep -q 'ChargedAnimationCycleGate' app/src/main/java/com/lucianotoscano/pvppokego/engine/BattleEngine.kt
          test -s app/src/test/java/com/lucianotoscano/pvppokego/engine/EnemyEnergyTrackerTest.kt
          test -s app/src/test/java/com/lucianotoscano/pvppokego/engine/ChargedMovePredictorTest.kt
          test -s app/src/test/java/com/lucianotoscano/pvppokego/engine/ReactionWindowEstimatorTest.kt
          test -s app/src/test/java/com/lucianotoscano/pvppokego/engine/StatStageTrackerTest.kt

          if grep -q 'PvPPokeGoAccessibilityCaptureService' app/src/main/AndroidManifest.xml; then
            echo "Accessibility service leaked into main manifest"
            exit 1
          fi
          if grep -q 'FOREGROUND_SERVICE_SPECIAL_USE\|specialUse\|PROPERTY_SPECIAL_USE_FGS_SUBTYPE' app/src/main/AndroidManifest.xml; then
            echo "SPECIAL_USE leaked into standard/main manifest"
            exit 1
          fi

      - name: Package offline PvPoke snapshot
        run: |
          python3 tools/package_offline_pvpoke_assets.py
          test -s app/src/main/assets/gamemaster.json
          test -s app/src/main/assets/rankings-1500.json
          test -s app/src/main/assets/rankings-2500.json
          test -s app/src/main/assets/rankings-10000.json
          test -s app/src/main/assets/pvpoke_cpms.json
          test -s app/src/main/assets/pvpoke_snapshot.json
          python3 - <<'PY'
          import json
          p=json.load(open("app/src/main/assets/pvpoke_snapshot.json"))
          assert p["pvpokeRef"] == "f627e89e53c0c7b903fff097df7a0ad0ac95decc"
          assert p["turnDurationMs"] == 500
          assert p["settings"]["maxBuffStages"] == 4
          assert p["settings"]["buffDivisor"] == 4
          assert p["sha256"]["gamemaster.json"]
          assert len(p["sha256"]["rankings"]) == 3
          print("PvPoke snapshot:", p["pvpokeRef"], p["generatedAtUtc"])
          PY

      - name: Build visual bank and HUD icon atlas
        run: |
          python3 -m venv .venv-visual
          . .venv-visual/bin/activate
          python -m pip install --disable-pip-version-check pillow
          python tools/package_visual_fingerprints.py
          test -s app/src/main/assets/pokemon_visual_fingerprints.json
          test -s app/src/main/assets/pokemon_icon_atlas.png
          test -s app/src/main/assets/pokemon_icon_atlas.json
          python3 - <<'PY'
          import json
          p=json.load(open("app/src/main/assets/pokemon_visual_fingerprints.json"))
          assert p["format"]=="PvPPokeGo-visual-fingerprints"
          assert p.get("version", 0) >= 2
          assert len(p["entries"]) >= 500
          assert any("_alolan" in e.get("speciesId","") for e in p["entries"])
          print("visual bank", len(p["entries"]), "entries")
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and compile both variants
        run: |
          gradle --no-daemon --stacktrace \
            :app:testStandardDebugUnitTest \
            :app:testRecorderCompatDebugUnitTest \
            :app:assembleStandardDebug \
            :app:assembleRecorderCompatDebug

      - name: Verify flavor manifests
        shell: bash
        run: |
          set -euo pipefail
          STD_MANIFEST="$(find app/build/intermediates/merged_manifests/standardDebug -name AndroidManifest.xml | head -1)"
          COMPAT_MANIFEST="$(find app/build/intermediates/merged_manifests/recorderCompatDebug -name AndroidManifest.xml | head -1)"
          test -n "$STD_MANIFEST"
          test -n "$COMPAT_MANIFEST"
          ! grep -q 'PvPPokeGoAccessibilityCaptureService' "$STD_MANIFEST"
          ! grep -q 'FOREGROUND_SERVICE_SPECIAL_USE\|specialUse\|PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$STD_MANIFEST"
          grep -q 'android:foregroundServiceType="mediaProjection"' "$STD_MANIFEST"
          grep -q 'PvPPokeGoAccessibilityCaptureService' "$COMPAT_MANIFEST"
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' "$COMPAT_MANIFEST"

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          STD=app/build/outputs/apk/standard/debug/app-standard-debug.apk
          COMPAT=app/build/outputs/apk/recorderCompat/debug/app-recorderCompat-debug.apk
          test -s "$STD"
          test -s "$COMPAT"
          unzip -t "$STD"
          unzip -t "$COMPAT"
          unzip -l "$STD" | grep -q 'pvppokego_launcher.png'
          unzip -l "$STD" | grep -q 'gamemaster.json'
          unzip -l "$STD" | grep -q 'pvpoke_snapshot.json'
          unzip -l "$STD" | grep -q 'pokemon_visual_fingerprints.json'
          if unzip -p "$STD" classes.dex | strings | grep -q 'PvPPokeGoAccessibilityCaptureService'; then
            echo "Sensitive accessibility class leaked into standard APK"
            exit 1
          fi

      - name: Package artifacts
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk artifact/PvPPokeGo-0.5.23.apk
          cp app/build/outputs/apk/recorderCompat/debug/app-recorderCompat-debug.apk artifact/PvPPokeGo-0.5.23-recorder-compat.apk
          sha256sum artifact/PvPPokeGo-0.5.23.apk > artifact/PvPPokeGo-0.5.23.apk.sha256
          sha256sum artifact/PvPPokeGo-0.5.23-recorder-compat.apk > artifact/PvPPokeGo-0.5.23-recorder-compat.apk.sha256
          cp app/src/main/assets/pvpoke_snapshot.json artifact/PvPPokeGo-0.5.23-pvpoke-snapshot.json

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-0.5.23
          path: artifact/
          retention-days: 14
