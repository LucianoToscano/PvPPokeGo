name: Build PvPPokeGo APK

on:
  push:
    branches:
      - android/apk-v02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate local PvPoke data
        run: python3 tools/update_pvpoke_data.py --output data/pvpoke

      - name: Generate complete pt-BR move aliases
        run: python3 tools/update_move_localization.py --output data/localization/moves_pt_BR.tsv

      - name: Sync type icons
        run: python3 tools/sync_type_icons.py --assets-root data

      - name: Run core tests
        run: gradle --no-daemon :core:test

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PvPPokeGo-V03-classic-debug.apk
          sha256sum dist/PvPPokeGo-V03-classic-debug.apk | tee dist/PvPPokeGo-V03-classic-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PvPPokeGo-V03-classic-debug
          path: |
            dist/PvPPokeGo-V03-classic-debug.apk
            dist/PvPPokeGo-V03-classic-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
